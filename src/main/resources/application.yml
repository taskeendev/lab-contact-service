# ทุกค่าจาก env — contact-service เป็นเจ้าของ DB ของตัวเอง (contactdb)
server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-—}] %logger{24} : %msg%n"

spring:
  application:
    name: contact-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

jwt:
  secret: ${JWT_SECRET}

contact:
  notify-to: ${CONTACT_NOTIFY_TO}
  notify-from: ${CONTACT_NOTIFY_FROM}
