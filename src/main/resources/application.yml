# ทุกค่าจาก env — contact-service เป็นเจ้าของ DB ของตัวเอง (contactdb)
server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-—}] %logger{24} : %msg%n"

spring:
  application:
    name: contact-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
